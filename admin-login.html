<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | CivicConnect</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-body"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">CC</span>CivicConnect</a><button class="icon-btn" id="themeToggle">🌙</button></header>
<main class="auth-wrap"><div class="auth-card"><div class="role-icon">🏛️</div><span class="eyebrow">ADMIN ACCESS</span><h1>Welcome, administrator</h1><p class="muted">Access the municipal command center and manage incoming cases.</p>
<form id="citizenLoginForm"><label>User ID<input id="username" required value="admin" autocomplete="username"></label><label style="display:block;margin-top:14px">Password<div class="password-wrap"><input id="password" type="password" required value="admin123" autocomplete="current-password"><button class="password-eye" type="button" aria-label="Show password" onclick="togglePassword()">👁</button></div></label><button class="btn primary full" type="submit">Login to Admin Console →</button><p id="loginError" class="error"></p></form>
<div class="demo-box"><strong>Demo access</strong><br>ID: admin<br>Password: admin123</div><a class="back-link" href="../index.html">← Back to CivicConnect</a></div></main>
<script src="storage.js"></script><script src="auth.js"></script><script src="app.js"></script><script>setupLogin("admin","citizenLoginForm","username","password","loginError");</script><script>function togglePassword(){const i=document.getElementById("password"),b=document.querySelector(".password-eye");i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"👁":"🙈";}</script></body></html>
